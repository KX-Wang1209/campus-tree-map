<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
     role="img" aria-label="天津滨海职业学院 · 校园植物地图">
  <title>天津滨海职业学院 · 校园植物地图</title>
  <!-- 一枚定位针，针孔里镂出一棵松树：一眼看出「在地图上标植物」。

       形状只有这一份，两处都用它：
         · 浏览器标签页：当图片直接显示 → 绿针，树是洞（透出标签栏底色）
         · 网页顶栏：用 CSS mask 拿这份形状当「印章」，想盖什么色就什么色
           （mask 只看形状的透明与否，不看这里填的绿色）

       所以改形状只改这一份文件，颜色各自定。 -->
  <path fill="#2e7d32" fill-rule="evenodd"
        d="M12 22.8C12 22.8 3.6 13.7 3.6 9.2a8.4 8.4 0 0 1 16.8 0c0 4.5-8.4 13.6-8.4 13.6Z
           M12 4 16 9.2 13.9 9.2 16.6 12.4 13.15 12.4 13.15 15.4 10.85 15.4 10.85 12.4 7.4 12.4 10.1 9.2 8 9.2Z"/>
